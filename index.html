<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beauty Products</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@400ж600&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="layout">
    <div class="buttons-container">
      <button id="change-all-card-color">Сменить цвет карточек</button>
      <button id="change-first-card-color">Сменить цвет карточки-1</button>
      <button id="open-google">Открыть страницу Google.com</button>
      <button id="output-console-log">Вывести сообщение в консоль лог</button>
      <button id="toggle-color-button" class="button-toggle">Переключить цвет</button>
    </div>

    <h1 class="catalog-title">Выбери свой продукт</h1>

    <ul id="catalog-list">

    </ul>

    <template id="catalog-template">
      <li class="catalog-container">
        <img class="catalog-image" src="" alt="Фото товар" /></img>
        <p class="catalog-subtitle"></p>
        <p class="catalog-name"></p>
        <p class="catalog-description"></p>
        <p class="catalog-composition">
          <b class="composition__label">Состав:</b>
        <ul class="composition__list"></ul>
        </p>
        <p class="catalog-price">
          <b class="price-box__label">Цена:</b>
          <span class="price-box"></span>
        </p>
      </li>
    </template>
  </div>

  <!--3) Сверставаем данный footer, используя семантические теги footer, nav и т.д.-->
  <footer class="footer">
    <nav class="footer__nav">
      <a href="#" class="footer__link">Главная :</a>
      <a href="#" class="footer__link">Каталог :</a>
      <a href="#" class="footer__link">Контакты :</a>
    </nav>
    <form class="email-form" id="email-form">
      <label for="email">Подписаться на рассылку:</label>
      <input placeholder="Введите ваш email" type="email" id="email" name="email" required />
      <input placeholder="Введите ваш пароль" type="password" id="password" name="password" required />
      <button type="submit">Подписаться</button>
    </form>
    <p class="footer__text">&copy; 2026 Beauty Products. Все права защищены.</p>
  </footer>

  <!--5) Создал кнопку "Регистрация" и модальное окно-->
  <button id="openBtn" class="openBtn">Регистрация</button>
  <div id="overlay" class="overlay">
    <div id="registrationModal" class="modal">
      <button id="closeBtn" class="close-x">&times;</button>
      <h2>Регистрация</h2>
      <form id="registrationForm">
        <label for="username">Имя:</label>
        <input placeholder="Введите ваше имя" type="text" id="username" name="username" required />

        <label for="fullname">Фамилия:</label>
        <input placeholder="Введите вашу фамилию" type="text" id="fullname" name="fullname" required />

        <label for="birthdate">Дата рождения:</label>
        <input placeholder="Введите вашу дату рождения" type="date" id="birthdate" name="birthdate" required />

        <label for="email">Email:</label>
        <input placeholder="Введите ваш email" type="email" id="email" name="email" required />

        <label for="password">Пароль:</label>
        <input placeholder="Введите ваш пароль" type="password" id="password" name="password" required />

        <label for="confirmPassword">Подтвердите пароль:</label>
        <input placeholder="Подтвердите пароль" type="password" id="confirmPassword" name="confirmPassword" required />
        <span class="error-message" id="passwordError"></span>

        <button type="submit" class="submit-btn">Зарегистрироваться</button>
      </form>
      <div class="created-on" id="createdOn"></div>
    </div>
  </div>


  <script src="main.js"></script>

  <script src="homework-7.js"></script>

  <script src="homework-8.js"></script>

  <script type="module" src="homework-9.js"></script>

  <script type="module" src="homework-10.js"></script>

  <script type="module" src="homework-11.js"></script>

</body>

</html>
